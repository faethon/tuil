python2.7:
  image: python:2.7-buster
  script:
    - pip install .[test]
    - pip install .
    - coverage run -m py.test
    - pylint --rcfile .pylintrc -E tuir/
    - coverage report

python3.8:
  image: python:3.8-rc-buster
  script:
    - pip install .[test]
    - pip install .
    - coverage run -m pytest
    - pylint --rcfile .pylintrc -E tuir/
    - coverage report

python3.12:
  image: python:3.12-bookworm
  script:
    - pip install .[test]
    - pip install .
    - coverage run -m pytest
    - pylint --rcfile .pylintrc -E tuir/
    - coverage report
