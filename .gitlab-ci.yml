python2.7:
  image: python:2.7-buster
  script: scripts/ci.sh

python3.10:
  image: python:3.10-bookworm
  script: scripts/ci.sh

python3.11:
  image: python:3.11-bullseye
  script: scripts/ci.sh

python3.12:
  image: python:3.12-alpine
  script: scripts/ci.sh

python3.13:
  image: python:3.13-bookworm
  script:
    - scripts/ci.sh
    - coverage xml
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  coverage: "/(100(?:[.]0+)?|[1-9]?[0-9](?:[.][0-9]+)?)%$/"

python3.14:
  image: python:3.14-rc-bullseye
  script: scripts/ci.sh
